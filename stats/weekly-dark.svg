<svg xmlns="http://www.w3.org/2000/svg" width="480" height="178" viewBox="0 0 480 178" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Weekly rhythm</title>
<desc id="desc">Contributions per weekday over the last 12 months (5,024 in total): Mon 868, Tue 857, Wed 797, Thu 734, Fri 528, Sat 636, Sun 604. Busiest: Mon.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
  .label { font-size: 13px; }
  .value { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .col { font-size: 9px; fill: #7d8590; letter-spacing: 0.02em; }
  .secondary { fill: #9198a1; }
  .muted { fill: #7d8590; }
  .icon { fill: #9198a1; }
  .fade { animation: fade 0.45s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out 0.5s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .rise { transform-box: fill-box; transform-origin: bottom; animation: rise 0.7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { transform: scaleY(0); } }
</style>
