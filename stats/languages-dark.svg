<svg xmlns="http://www.w3.org/2000/svg" width="350" height="133" viewBox="0 0 350 133" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Most used languages</title>
<desc id="desc">Java 24.9%, Shell 22.8%, Vue 18.2%, Python 14.4%, C++ 11.4%, C 8.2%</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
  .label { font-size: 13px; }
  .value { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .head { font-size: 11px; fill: #7d8590; letter-spacing: 0.02em; }
  .title { font-size: 15px; font-weight: 600; }
  .secondary { fill: #9198a1; }
  .muted { fill: #7d8590; }
  .icon { fill: #9198a1; }
  .fade { animation: fade 0.45s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out 0.5s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="349" height="132" rx="6" fill="none" stroke="none"/>

<mask id="bar"><rect class="grow" x="25" y="25" width="300" height="8" rx="4" fill="#fff"/></mask>
<g mask="url(#bar)"><rect x="25.00" y="25" width="72.16" height="8" fill="#b07219"/><rect x="99.16" y="25" width="66.17" height="8" fill="#89e051"/><rect x="167.33" y="25" width="52.92" height="8" fill="#41b883"/><rect x="222.25" y="25" width="41.81" height="8" fill="#3572A5"/><rect x="266.06" y="25" width="33.18" height="8" fill="#f34b7d"/><rect x="301.24" y="25" width="23.76" height="8" fill="#555555"/></g>
<g transform="translate(25 50)"><g class="fade" style="animation-delay: 200ms"><circle cx="5" cy="6" r="5" fill="#b07219"/><text x="16" y="10.5" class="label" style="font-size: 12px;">Java <tspan class="secondary">24.9%</tspan></text></g></g>
<g transform="translate(175 50)"><g class="fade" style="animation-delay: 270ms"><circle cx="5" cy="6" r="5" fill="#89e051"/><text x="16" y="10.5" class="label" style="font-size: 12px;">Shell <tspan class="secondary">22.8%</tspan></text></g></g>
<g transform="translate(25 75)"><g class="fade" style="animation-delay: 340ms"><circle cx="5" cy="6" r="5" fill="#41b883"/><text x="16" y="10.5" class="label" style="font-size: 12px;">Vue <tspan class="secondary">18.2%</tspan></text></g></g>
<g transform="translate(175 75)"><g class="fade" style="animation-delay: 410ms"><circle cx="5" cy="6" r="5" fill="#3572A5"/><text x="16" y="10.5" class="label" style="font-size: 12px;">Python <tspan class="secondary">14.4%</tspan></text></g></g>
<g transform="translate(25 100)"><g class="fade" style="animation-delay: 480ms"><circle cx="5" cy="6" r="5" fill="#f34b7d"/><text x="16" y="10.5" class="label" style="font-size: 12px;">C++ <tspan class="secondary">11.4%</tspan></text></g></g>
<g transform="translate(175 100)"><g class="fade" style="animation-delay: 550ms"><circle cx="5" cy="6" r="5" fill="#555555"/><text x="16" y="10.5" class="label" style="font-size: 12px;">C <tspan class="secondary">8.2%</tspan></text></g></g>
</svg>
