<svg xmlns="http://www.w3.org/2000/svg" width="480" height="178" viewBox="0 0 480 178" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Most used languages</title>
<desc id="desc">Java 24.9%, Shell 22.8%, Vue 18.2%, Python 14.4%, C++ 11.4%, C 8.2%</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .label { font-size: 13px; }
  .value { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .col { font-size: 9px; fill: #818b98; letter-spacing: 0.02em; }
  .secondary { fill: #59636e; }
  .muted { fill: #818b98; }
  .icon { fill: #59636e; }
  .fade { animation: fade 0.45s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out 0.5s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="479" height="177" rx="6" fill="none" stroke="none"/>
<text x="18" y="29" class="col">MOST USED LANGUAGES</text>
<mask id="bar"><rect class="grow" x="18" y="44" width="444" height="10" rx="5" fill="#fff"/></mask>
<g mask="url(#bar)"><rect x="18.00" y="44" width="107.99" height="10" fill="#b07219"/><rect x="127.99" y="44" width="99.04" height="10" fill="#89e051"/><rect x="229.03" y="44" width="79.19" height="10" fill="#41b883"/><rect x="310.23" y="44" width="62.56" height="10" fill="#3572A5"/><rect x="374.79" y="44" width="49.66" height="10" fill="#f34b7d"/><rect x="426.45" y="44" width="35.55" height="10" fill="#555555"/></g>
<g transform="translate(18 80)"><g class="fade" style="animation-delay: 200ms"><circle cx="5" cy="6" r="5" fill="#b07219"/><text x="16" y="10.5" class="label" style="font-size: 12px;">Java <tspan class="secondary">24.9%</tspan></text></g></g>
<g transform="translate(240 80)"><g class="fade" style="animation-delay: 270ms"><circle cx="5" cy="6" r="5" fill="#89e051"/><text x="16" y="10.5" class="label" style="font-size: 12px;">Shell <tspan class="secondary">22.8%</tspan></text></g></g>
<g transform="translate(18 108)"><g class="fade" style="animation-delay: 340ms"><circle cx="5" cy="6" r="5" fill="#41b883"/><text x="16" y="10.5" class="label" style="font-size: 12px;">Vue <tspan class="secondary">18.2%</tspan></text></g></g>
<g transform="translate(240 108)"><g class="fade" style="animation-delay: 410ms"><circle cx="5" cy="6" r="5" fill="#3572A5"/><text x="16" y="10.5" class="label" style="font-size: 12px;">Python <tspan class="secondary">14.4%</tspan></text></g></g>
<g transform="translate(18 136)"><g class="fade" style="animation-delay: 480ms"><circle cx="5" cy="6" r="5" fill="#f34b7d"/><text x="16" y="10.5" class="label" style="font-size: 12px;">C++ <tspan class="secondary">11.4%</tspan></text></g></g>
<g transform="translate(240 136)"><g class="fade" style="animation-delay: 550ms"><circle cx="5" cy="6" r="5" fill="#555555"/><text x="16" y="10.5" class="label" style="font-size: 12px;">C <tspan class="secondary">8.2%</tspan></text></g></g>
</svg>
